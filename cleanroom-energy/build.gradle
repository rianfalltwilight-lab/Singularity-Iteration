    args layout.projectDirectory.file('fixtures/observed-generator-packets.tsv').asFile.absolutePath
    jvmArgs '-Xms32m', '-Xmx128m'
}

tasks.named('check') {
    dependsOn tasks.named('contractTest'), tasks.named('treeContractTest'), tasks.named('distributorContractTest')
}

