    classpath = sourceSets.contract.runtimeClasspath
    mainClass = 'dev.scex.energy.ConductorRegistryContract'
    jvmArgs '-Xms32m', '-Xmx128m'
}
tasks.named('check') { dependsOn tasks.named('registryContractTest') }

tasks.register('effectsContractTest', JavaExec) {
    dependsOn tasks.named('contractClasses')
    classpath = sourceSets.contract.runtimeClasspath
    mainClass = 'dev.scex.energy.UniformPacketEffectsContract'
    args layout.projectDirectory.file('fixtures/observed-effects.tsv').asFile.absolutePath
    jvmArgs '-Xms32m', '-Xmx128m'
